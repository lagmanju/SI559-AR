<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Fit Check TV Viewer</title>
    <!-- Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <!-- Three.js to generate the TV 3D asset programmatically -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    
    <style>
      :root {
        --amazon-dark: #232f3e;
        --amazon-accent: #febd69;
        --ui-text: #ffffff;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      body { width: 100vw; height: 100vh; overflow: hidden; background-color: #000; }
      
      model-viewer {
        width: 100%;
        height: 100%;
        --poster-color: transparent;
      }

      /* TOP UI BAR */
      .top-ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px;
        background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 20px;
        z-index: 10;
        pointer-events: none;
      }

      .top-title {
        color: var(--ui-text);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      /* BOTTOM UI BAR */
      .bottom-ui {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100px;
        background-color: var(--amazon-dark);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 25px 20px 25px;
        z-index: 10;
        border-top: 1px solid rgba(255,255,255,0.1);
      }

      .size-display {
        color: var(--ui-text);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
      }

      .size-label {
        font-size: 11px;
        text-transform: uppercase;
        color: #999;
        letter-spacing: 1px;
      }

      .size-value {
        font-size: 22px;
        font-weight: 700;
        color: var(--amazon-accent);
      }

      .ar-launch-btn {
        width: 68px;
        height: 68px;
        background-color: #ffffff;
        border-radius: 50%;
        border: 4px solid #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        position: relative;
        top: -12px;
        cursor: pointer;
      }

      .ar-launch-btn:active {
        transform: scale(0.95);
      }

      .ar-launch-btn svg {
        width: 30px;
        height: 30px;
        fill: var(--amazon-dark);
      }

      .right-icon {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .right-icon svg {
        width: 30px;
        height: 30px;
        fill: #999;
      }

      model-viewer#ar-viewer {
        --ar-button-display: none;
      }
    </style>
  </head>
  <body>

    <!-- TOP HEADER -->
    <div class="top-ui">
      <div class="top-title">Fit Check</div>
    </div>

    <!-- AR VIEW CONTAINER -->
    <model-viewer 
      id="ar-viewer"
      ar 
      ar-modes="quick-look webxr scene-viewer" 
      ar-placement="wall" 
      camera-controls 
      interaction-prompt="none"
      alt="Flat screen TV prototype"
      can-scale>
    </model-viewer>

    <!-- AMAZON STYLE BOTTOM BAR -->
    <div class="bottom-ui">
      <div class="size-display">
        <div class="size-label">Est. Size</div>
        <div class="size-value">55" TV</div>
      </div>

      <button class="ar-launch-btn" id="custom-ar-button" aria-label="Launch AR">
        <!-- Camera Icon -->
        <svg viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>

      <div class="right-icon">
        <!-- TV Icon -->
        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
      </div>
    </div>

    <script>
      // PROGRAMMATICALLY GENERATE A FLAT 16:9 TV PANEL GLB
      function createTVModel() {
        const scene = new THREE.Scene();

        // TV Outer Frame (Black Bezel)
        const frameWidth = 1.2;  // ~55 inch scale in meters
        const frameHeight = 0.68;
        const frameDepth = 0.03;  // Thin flat screen panel
        
        const frameGeometry = new THREE.BoxGeometry(frameWidth, frameHeight, frameDepth);
        const frameMaterial = new THREE.MeshStandardMaterial({ 
          color: 0x111111, 
          roughness: 0.2, 
          metalness: 0.8 
        });
        const tvFrame = new THREE.Mesh(frameGeometry, frameMaterial);

        // Screen Face (Dark Glossy Glass)
        const screenGeometry = new THREE.PlaneGeometry(frameWidth - 0.04, frameHeight - 0.04);
        const screenMaterial = new THREE.MeshStandardMaterial({ 
          color: 0x050505, 
          roughness: 0.1, 
          metalness: 0.9 
        });
        const tvScreen = new THREE.Mesh(screenGeometry, screenMaterial);
        tvScreen.position.z = (frameDepth / 2) + 0.001; // Slightly in front of bezel

        scene.add(tvFrame);
        scene.add(tvScreen);

        // Export directly to GLB Blob
        const exporter = new THREE.GLTFExporter();
        exporter.parse(
          scene,
          function (gltf) {
            const blob = new Blob([gltf], { type: 'model/gltf-binary' });
            const url = URL.createObjectURL(blob);
            
            // Assign generated URL to model-viewer
            const modelViewer = document.querySelector('#ar-viewer');
            modelViewer.src = url;
          },
          { binary: true }
        );
      }

      // Initialize the TV 3D model on load
      window.addEventListener('DOMContentLoaded', createTVModel);

      // Connect AR Launch Button
      const modelViewer = document.querySelector('#ar-viewer');
      const customButton = document.querySelector('#custom-ar-button');
      
      customButton.addEventListener('click', () => {
        modelViewer.activateAR();
      });
    </script>
  </body>
</html>
